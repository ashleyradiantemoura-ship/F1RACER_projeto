<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A0A0A">

    <title>Momentos Históricos — F1RACER</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <style>
        .momentos-search {
            max-width: 760px;
            margin-bottom: 12px;
        }

        #pesquisa-momentos {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #141414;
            color: #fff;
            font-family: "Outfit", sans-serif;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #pesquisa-momentos:focus {
            border-color: #e10600;
            box-shadow: 0 0 0 2px rgba(225, 6, 0, 0.15);
        }

        #pesquisa-momentos::placeholder {
            color: #888;
        }

        #resultado-pesquisa {
            color: var(--muted);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .pesquisa-vazia {
            grid-column: 1 / -1;
            padding: 35px 20px;
            text-align: center;
            color: var(--muted);
        }

        .pesquisa-vazia h2 {
            color: #fff;
            font-family: "Bebas Neue", sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body data-page="catalogo">

    <div id="site-header"></div>

    <main class="container page-top">

        <p class="eyebrow">Explore a Fórmula 1</p>

        <h1 class="display h1">Momentos Históricos</h1>

        <p style="max-width: 760px; color: var(--muted); margin-bottom: 28px;">
            Relembre vitórias, rivalidades e decisões que fizeram história.
            Clique em um card para assistir ao vídeo.
        </p>

        <!-- Barra de pesquisa -->
        <div class="momentos-search">
            <input
                type="search"
                id="pesquisa-momentos"
                placeholder="Pesquisar por Senna, Schumacher, Ferrari..."
                autocomplete="off"
                aria-label="Pesquisar momentos históricos"
            >
        </div>

        <p id="resultado-pesquisa" aria-live="polite"></p>

        <!-- Cards dos momentos históricos -->
        <div class="grid grid-main" id="video-grid"></div>

        <div class="back-home">
            <a href="catalogo.html">← Voltar ao catálogo</a>
        </div>

    </main>

    <div id="site-footer"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <script>

            // 1. Ayrton Senna - Mônaco 1984

            },

            // 3. Niki Lauda - Retorno 1976
            {

                year: "1976",

            },

            {

                rating: "4.9",
                image: "https://i.pinimg.com/736x/00/bf/47/00bf470a25d238a7325a4de94d030ed9.jpg",
                synopsis: "Rubens Barrichello conquistou sua primeira vitória na F1. Em uma prova marcada por mudanças climáticas e estratégias de pneus, largando em 18º, Rubens fez uma corrida de recuperação e conquistou sua primeira vitória na Fórmula 1 pela Ferrari.",
                trailer_id: "96wCoIKgzlI"

            // 10. GP de San Marino - Ímola 1994
            {
                id: "momento-imola-1994",
                category_id: "momentos-historicos",
                title: "Um fim de semana que mudou a F1",
                badge: "Momento histórico",
                year: "1994",
                duration: "Ímola, San Marino",
                rating: "4.9",
                image: "https://i.pinimg.com/736x/f5/79/de/f579ded3b2e2b1cf18388005a42d7869.jpg",
                synopsis: "O fim de semana do GP de San Marino de 1994 foi um dos mais tristes da história da categoria. As perdas de Roland Ratzenberger e Ayrton Senna marcaram profundamente a Fórmula 1 e tiveram grande impacto nas discussões e nas melhorias de segurança do automobilismo.",
                trailer_id: "kmAB-Vo4Tf4"
            }

        ];

        // Registra os vídeos na lista geral
        pageItems.forEach(item => {
            ITEMS[item.id] = item;
        });

        // Elementos da pesquisa
        const pesquisaMomentos = document.getElementById("pesquisa-momentos");
        const videoGrid = document.getElementById("video-grid");
        const resultadoPesquisa = document.getElementById("resultado-pesquisa");

        // Pesquisa os momentos históricos
        function pesquisarMomentos() {
            const termo = pesquisaMomentos.value.trim().toLowerCase();

            // Filtra os cards pelo título, descrição, ano e local
            const resultados = pageItems.filter(item => {
                const titulo = (item.title || "").toLowerCase();
                const descricao = (item.synopsis || "").toLowerCase();
                const ano = String(item.year || "").toLowerCase();
                const local = (item.duration || "").toLowerCase();

                return (
                    titulo.includes(termo) ||
                    descricao.includes(termo) ||
                    ano.includes(termo) ||
                    local.includes(termo)
                );
            });

            // Atualiza a quantidade de resultados
            resultadoPesquisa.textContent =
                resultados.length +
                (resultados.length === 1
                    ? " momento encontrado"
                    : " momentos encontrados");

            // Exibe mensagem se não houver resultados
            if (resultados.length === 0) {
                videoGrid.innerHTML = `
                    <div class="pesquisa-vazia">
                        <h2>Nenhum momento encontrado</h2>
                        <p>Tente pesquisar outro piloto, ano ou circuito.</p>
                    </div>
                `;
                return;
            }

            // Cria os cards encontrados
            videoGrid.innerHTML = resultados
                .map(item => '<div class="reveal">' + cardHTML(item) + '</div>')
                .join("");

            // Ativa as animações
            observeReveals(videoGrid);
        }

        // Pesquisa enquanto digita
        pesquisaMomentos.addEventListener("input", pesquisarMomentos);

        // Exibe todos os momentos ao abrir a página
        pesquisarMomentos();
    </script>

</body>
</html>
