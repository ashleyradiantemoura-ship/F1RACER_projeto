<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <title>Catálogo — F1RACER</title>

    <p class="count" id="count"></p>

  <div class="back-home"><a href="index.html">← Voltar para a home</a></div>
